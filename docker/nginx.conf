server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # index.html / sw.js MUST NOT be cached: they reference hashed JS/CSS
    # chunks and the SW kill-switch needs to actually update.  `always`
    # forces headers even on non-2xx and applies for try_files-fallback.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # SPA: all routes serve index.html — and apply no-cache headers because
    # try_files internal-redirects to /index.html, but Caddy upstream sees
    # the original URL ('/') and might miss `location = /index.html` headers.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri $uri/ /index.html;
    }

    # Companion APK: bind mount instead of baking it into the image (66 MB). Sits behind
    # Caddy's forward_auth like the rest of the shell → signed-in users only.
    # `default_type` + `=404` prevent the SPA fallback from silently serving index.html
    # as the "APK" when the file is missing (the classic everything-returns-200 gotcha).
    location /downloads/ {
        alias /srv/downloads/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        expires 5m;
        try_files $uri =404;
    }

    # Desktop companion: installer + update manifest. ALSO publicly reachable via the
    # apex domain in the reverse proxy — a freshly set up PC has neither a session nor
    # VPN access. Separate location because neither the APK MIME type nor `attachment`
    # fits latest.json (the updater reads it as a response body).
    location /downloads/desktop/ {
        alias /srv/downloads/desktop/;
        default_type application/octet-stream;
        # .pub as text/plain: otherwise PowerShell 5.1 returns `Invoke-WebRequest .Content`
        # as a byte array (no .Trim() possible).
        types { application/json json; text/plain pub ps1 txt; }
        expires 5m;
        try_files $uri =404;
    }

    # Unhashed assets of optional installation-specific features (public/heim/) — short
    # cache so asset swaps propagate within minutes, not weeks. Vite-hashed
    # /assets/ stays at 30d below.
    location /heim/ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # WebSocket endpoints (terminal/ws, actions/ws, …): nginx does NOT pass Upgrade
    # headers through automatically — without this block WS handshakes reach the
    # backend as plain GETs (404). Affects direct access to this port; the Caddy
    # path handles WS natively.
    location ~ ^/api/.+/ws$ {
        set $backend "http://claraos-api:8090";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Authentik-Username $http_x_authentik_username;
        proxy_set_header X-Authentik-Email $http_x_authentik_email;
        proxy_set_header X-Authentik-Name $http_x_authentik_name;
        proxy_set_header X-Authentik-Uid $http_x_authentik_uid;
        proxy_set_header X-Authentik-Groups $http_x_authentik_groups;
    }

    # Proxy API requests to backend (resolved at request time, not startup)
    location /api/ {
        set $backend "http://claraos-api:8090";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through Authentik headers from Caddy
        proxy_set_header X-Authentik-Username $http_x_authentik_username;
        proxy_set_header X-Authentik-Email $http_x_authentik_email;
        proxy_set_header X-Authentik-Name $http_x_authentik_name;
        proxy_set_header X-Authentik-Uid $http_x_authentik_uid;
        proxy_set_header X-Authentik-Groups $http_x_authentik_groups;
    }

    # Cache hashed static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
