#cloud-config
# Base setup of a ClaraOS cell (Debian 13).
# Only the foundation: admin user, SSH by key only, automatic security
# updates, Docker. The services follow later via Compose (setup.sh).
# Hetzner installs the SSH key for root at creation time (ssh_keys); we copy
# it to the admin user and then disable root login.

package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - apt-listchanges
  - ca-certificates
  - curl
  - fail2ban
  - htop
  - jq
  - restic

users:
  - default
  - name: clara
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true

write_files:
  - path: /etc/ssh/sshd_config.d/10-zelle.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers clara
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "20m", "max-file": "3"}}

runcmd:
  - install -d -m 700 -o clara -g clara /home/clara/.ssh
  - install -m 600 -o clara -g clara /root/.ssh/authorized_keys /home/clara/.ssh/authorized_keys
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker clara
  - systemctl enable --now docker fail2ban
  - timedatectl set-timezone Europe/Berlin
  - systemctl restart ssh
  - touch /var/lib/zelle-bereit
