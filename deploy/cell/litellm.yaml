# The cell's LiteLLM — cloud models only (Anthropic), no clara-agent.
#
# Important: the aliases are the names the ClaraOS code requests anyway:
#    clara/everyday   — default model of the Clara chat (core/stores/claraChatSettings.ts)
#    gemini-flash …   — image description/marker pre-pass (chat_v2, marker_context)
#    claude-haiku-4-5 — requested directly
#    Other installations may point them to a local agent or other providers; here to Anthropic.
#    No code has to change — only this file.
# Important: prices are stated explicitly (as of 06/2026, $ per token). If LiteLLM does
#    not know a model, it counts $0 — and NO budget limit ever triggers.
# Default = Opus (highest quality, highest cost). Cheaper: point
#    clara/everyday at claude-sonnet-5 ($2/$10) or claude-haiku-4-5 ($1/$5).

x-opus: &opus
  model: anthropic/claude-opus-5
  # Warning: chat_v2 sends `meta` (app context for the agent); Anthropic rejects
  # unknown fields ("meta: Extra inputs are not permitted"). drop_params only
  # removes KNOWN parameters — unknown ones must be listed here.
  additional_drop_params: ["meta", "chat_id"]
  api_key: os.environ/ANTHROPIC_API_KEY
  input_cost_per_token: 0.000005
  output_cost_per_token: 0.000025

x-haiku: &haiku
  model: anthropic/claude-haiku-4-5
  # Warning: chat_v2 sends `meta` (app context for the agent); Anthropic rejects
  # unknown fields ("meta: Extra inputs are not permitted"). drop_params only
  # removes KNOWN parameters — unknown ones must be listed here.
  additional_drop_params: ["meta", "chat_id"]
  api_key: os.environ/ANTHROPIC_API_KEY
  input_cost_per_token: 0.000001
  output_cost_per_token: 0.000005

model_list:
  - model_name: clara/everyday
    litellm_params: *opus
  - model_name: claude-haiku-4-5
    litellm_params: *haiku
  - model_name: claude-haiku-4-5-20251001
    litellm_params: *haiku
  - model_name: gemini-flash
    litellm_params: *haiku
  - model_name: gemini-flash-lite
    litellm_params: *haiku
  - model_name: gemini-3-flash
    litellm_params: *haiku
  - model_name: gemini-2.5-flash
    litellm_params: *haiku

litellm_settings:
  # Second safety net below the provider's workspace spend limit: LiteLLM itself
  # stops the whole cell at max_budget (USD) per budget_duration. Example values —
  # set them below your own provider limit.
  max_budget: 25
  budget_duration: 30d
  drop_params: true
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
