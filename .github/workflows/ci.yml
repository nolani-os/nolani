name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history and working tree
        run: |
          ./gitleaks git --redact --no-banner .
          ./gitleaks dir --redact --no-banner .

  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest respx
      - name: Compile every module
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: API image
        run: docker build -f docker/Dockerfile.api -t claraos-api:ci .
      - name: Frontend image (runs the mobile smoke test and the Vite build)
        run: docker build -f docker/Dockerfile.frontend -t claraos-frontend:ci .
