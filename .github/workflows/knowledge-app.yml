name: Knowledge app

# Builds the standalone Knowledge app (packages/app-knowledge) for Linux,
# Windows and Android on every change to it on main. A tag `knowledge-vX.Y.Z`
# additionally creates a DRAFT release with the packages attached; publishing
# it stays a manual step.
#
# Android release signing uses two repository secrets:
#   ANDROID_KEYSTORE_B64       base64 of the PKCS12 key store
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key)
# Without them (forks, pull requests) the APK is built unsigned.

on:
  push:
    tags: ["knowledge-v*"]
    # Also on every change to the app on main (no release): a broken build shows up
    # before anyone tags a version.
    branches: [main]
    paths:
      - "packages/app-knowledge/**"
      - "packages/shell/src/apps/wissen/**"
      - "packages/shell/src/apps/ideas/**"
      - ".github/workflows/knowledge-app.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP: packages/app-knowledge

jobs:
  web:
    name: Web part
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install workspace (the app reuses packages/shell)
        run: |
          npm install -g pnpm@9
          pnpm install --frozen-lockfile
      - name: Install app dependencies
        run: npm ci
        working-directory: ${{ env.APP }}
      - name: Build
        run: node ../shell/node_modules/vite/bin/vite.js build
        working-directory: ${{ env.APP }}
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: ${{ env.APP }}/dist
          if-no-files-found: error

  linux:
    name: Linux (.deb, AppImage)
    needs: web
    runs-on: ubuntu-22.04  # older glibc: the packages run on more distributions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: ${{ env.APP }}/dist
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libfuse2 file
      - name: Build
        run: |
          npm ci
          npx tauri build --bundles deb,appimage
        working-directory: ${{ env.APP }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            ${{ env.APP }}/src-tauri/target/release/bundle/deb/*.deb
            ${{ env.APP }}/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (installer)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: ${{ env.APP }}/dist
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Build
        run: |
          npm ci
          npx tauri build --bundles nsis
        working-directory: ${{ env.APP }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ env.APP }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android (APK, arm64)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: ${{ env.APP }}/dist
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: NDK and Rust target
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - name: Signing key (only when the secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets: building an unsigned APK"; exit 0; fi
          dir="$RUNNER_TEMP/signing"; mkdir -p "$dir"; chmod 700 "$dir"
          echo "$KEYSTORE_B64" | base64 -d > "$dir/release.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$dir/pw"
          chmod 600 "$dir"/*
          printf 'storeFile=%s\nkeyAlias=nolani-knowledge\npasswordFile=%s\n' "$dir/release.jks" "$dir/pw" \
            > src-tauri/gen/android/keystore.properties
        working-directory: ${{ env.APP }}
      - name: Build
        run: |
          npm ci
          npx tauri android build --apk --target aarch64
        working-directory: ${{ env.APP }}
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ env.APP }}/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/knowledge-v')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#knowledge-v}"
          mkdir -p files
          # An artifact with several paths keeps their sub-folders (deb/, appimage/): search.
          pick() { f=$(find "out/$1" -type f -name "$2" | head -n 1); [ -n "$f" ] || { echo "missing $1/$2"; exit 1; }; echo "$f"; }
          cp "$(pick linux '*.deb')" "files/nolani-knowledge-${version}-linux-amd64.deb"
          cp "$(pick linux '*.AppImage')" "files/nolani-knowledge-${version}-linux-amd64.AppImage"
          cp "$(pick windows '*.exe')" "files/nolani-knowledge-${version}-windows-setup.exe"
          cp "$(pick android '*.apk')" "files/nolani-knowledge-${version}-android-arm64.apk"
          (cd files && sha256sum * > SHA256SUMS)
          gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Nolani Knowledge ${version}" \
            --notes "Standalone Knowledge app: notes, pages and databases on your device. See packages/app-knowledge/README.md."
